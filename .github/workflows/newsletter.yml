name: Send newsletter on publish

# Fires only when posts change. A Node script emails subscribers about any
# newly-published post via the MailerLite API, then commits an "already sent"
# ledger so re-publishing never double-sends. No always-on backend needed —
# this is ephemeral CI triggered by your publish push.
on:
  push:
    branches: [main]
    paths:
      - 'content/posts.json'
  workflow_dispatch:

permissions:
  contents: write # to commit the updated newsletter-sent.json ledger

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send newsletter for newly-published posts
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_GROUP_ID: ${{ vars.MAILERLITE_GROUP_ID }}
          MAILERLITE_FROM_EMAIL: ${{ vars.MAILERLITE_FROM_EMAIL }}
          MAILERLITE_FROM_NAME: ${{ vars.MAILERLITE_FROM_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/send-newsletter.mjs

      - name: Commit updated ledger
        run: |
          if [[ -n "$(git status --porcelain content/newsletter-sent.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/newsletter-sent.json
            git commit -m "chore(newsletter): record sent posts [skip ci]"
            git push
          else
            echo "Ledger unchanged — nothing to commit."
          fi
