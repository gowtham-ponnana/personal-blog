<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the saved theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gowtham's Blog</title>

    <!-- social-meta:start -->
    <meta name="description" content="A collection of thoughts, ideas, and experiences from Gowtham Ponnana." />
    <link rel="canonical" href="https://gowthamponnana.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gowtham's Blog" />
    <meta property="og:title" content="Gowtham's Blog" />
    <meta property="og:description" content="A collection of thoughts, ideas, and experiences from Gowtham Ponnana." />
    <meta property="og:url" content="https://gowthamponnana.com/" />
    <meta property="og:image" content="https://gowthamponnana.com/signature.png" />
    <meta property="og:image:alt" content="Gowtham's Blog" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gowtham's Blog" />
    <meta name="twitter:description" content="A collection of thoughts, ideas, and experiences from Gowtham Ponnana." />
    <meta name="twitter:image" content="https://gowthamponnana.com/signature.png" />
    <!-- social-meta:end -->
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- PrismJS CSS for code highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

  </head>

    <div id="root"></div>
